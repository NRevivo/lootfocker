<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker</title>
    <link rel="icon" href="./images/lf.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="js/storelocator.js"></script>
</head> 

<body>
    <!-- לשונית עליונה -->
    <script src="js/header.js"></script>
    <div id="header-container"></div>
    <!-- לשונית עליונה -->

    <section class="store-locator-container">
        <div class="store-details-table">
            <h2>Find Our Stores</h2>
            <table class="store-table">
                <thead>
                    <tr>
                        <th>Store Name</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody id="store-list">
                    <!-- התוכן של הסניפים יתווסף כאן -->
                </tbody>
            </table>
        </div>
        <div id="map"></div>
    </section>
    
    <!-- לשונית תחתונה -->
    <div id="footer-container"></div>
    <script src="js/footer.js"></script>
    <!-- לשונית תחתונה -->
    
    <!-- Google Maps JavaScript API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDfdAt7Mx6RWexvVpp8OC9gsabWVyX7IxE&callback=initMap">
    </script>
</body>
</html>
