<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="js/homepage.js"></script>
</head>
<body>
    <!-- Placeholder for header -->
    <div id="header-container"></div>

    <main>
        <section class="hero-carousel">
            <!-- Existing carousel slides -->
            <div class="carousel-slide active">
                <img src="/images/banner1.jpg" alt="New Arrivals">
                <div class="carousel-content">
                    <h1>New Arrivals</h1>
                    <p>Check out the latest styles</p>
                    <a href="#" class="cta-button">Shop Now</a>
                </div>
            </div>
            <div class="carousel-slide">
                <img src="/images/banner2.jpg" alt="Summer Sale">
                <div class="carousel-content"></div>  
                </div>
            </div>
            <!-- New Sales Banner -->
            <div class="carousel-slide">
                <img src="/images/banner3.webp" alt="Fall Collection Sale">
                <div class="carousel-content">
                </div>
            </div>
        </section>

        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x300?text=Product+1" alt="Product 1">
                    <img src="https://via.placeholder.com/300x300?text=Product+1+Alt" alt="Product 1 Alternative" class="hover-image">
                    <h3>Product 1</h3>
                    <p class="price">₪299.99</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x300?text=Product+2" alt="Product 2">
                    <img src="https://via.placeholder.com/300x300?text=Product+2+Alt" alt="Product 2 Alternative" class="hover-image">
                    <h3>Product 2</h3>
                    <p class="price">₪249.99</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x300?text=Product+3" alt="Product 3">
                    <img src="https://via.placeholder.com/300x300?text=Product+3+Alt" alt="Product 3 Alternative" class="hover-image">
                    <h3>Product 3</h3>
                    <p class="price">₪199.99</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/300x300?text=Product+4" alt="Product 4">
                    <img src="https://via.placeholder.com/300x300?text=Product+4+Alt" alt="Product 4 Alternative" class="hover-image">
                    <h3>Product 4</h3>
                    <p class="price">₪349.99</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>

   <!-- Placeholder for footer -->
   <div id="footer-container"></div>
</body>
</html>
