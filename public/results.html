<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker</title>
    <link rel="icon" href="./images/lf.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    


    <style>
        body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f9f9f9;
    color: #333;
}

.results-container {
    display: flex;
    padding: 40px 20px;
    max-width: 1400px;
    margin: 0 auto;
    gap: 40px;
}

/* Filters Section Styling */
.filters-section {
    width: 280px;
    position: sticky;
    top: 20px;
    align-self: flex-start;
    background: #fff;
    padding: 20px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    margin-left: 0;
}

.filter-group {
    margin-bottom: 35px;
    border-bottom: 1px solid #eee;
    padding-bottom: 25px;
}

.filter-group:last-child {
    border-bottom: none;
}

.filter-group h3 {
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
}

/* עיצוב משותף לכל האפשרויות */
.filter-option {
    display: flex;
    align-items: center;
    margin: 8px 0;
    cursor: pointer;
}

.filter-option input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-right: 5px;
    border: 2px solid #ccc;
    border-radius: 4px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    position: relative;
}

.filter-option input[type="checkbox"]:checked {
    background-color: #ff0000;
    border-color: #ff0000;
}

.filter-option input[type="checkbox"]:checked::after {
    content: '✓';
    color: white;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
}

.filter-option input[type="checkbox"]:checked + span {
    color: #ff0000;
    font-weight: bold;
}

.filter-option input[type="checkbox"]:hover {
    border-color: #ff0000;
}

/* עיצוב מיוחד לאזור המידות */
.filter-options.size-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.size-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

/* Price Range Styling */
.price-filter {
    padding: 10px 0;
}

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    background: #ddd;
    border-radius: 5px;
    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: #000;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid white;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

.price-values {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #666;
    margin-top: 10px;
}

/* Results Section Styling */
.products-section {
    flex: 1;
}

.results-info {
    margin-bottom: 30px;
    font-size: 15px;
    color: #666;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 30px;
}

/* Product Card Styling */
.product-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: transform 0.2s;
    position: relative;
}

.product-card:hover {
    transform: translateY(-10px);
    z-index: 10;
}

.product-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    transition: transform 0.3s ease-in-out;
    z-index: 1;
    position: relative;
}

.product-card:hover .product-image {
    transform: scale(1.05);
}

.product-details {
    padding: 20px;
    text-align: center;
    background: #fff;
    position: relative;
    z-index: 2;
}

.product-details h4 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #333;
}

.product-details p {
    font-size: 14px;
    color: #777;
}
.brands-list .filter-option {
    margin: 15px 0;  
    padding: 5px 0; 
}
    </style>
</head>
<body>

            <div class="filter-group">

        <main class="products-section">

<!-- לשונית תחתונה -->
<div id="footer-container"></div>
