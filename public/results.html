<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    


    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        .results-container {
            display: flex;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
            gap: 40px;
        }

        /* Filters Section Styling */
        .filters-section {
            width: 280px;
            position: sticky;
            top: 20px;
            align-self: flex-start;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-left: 0;
        }

        .filter-group {
            margin-bottom: 35px;
            border-bottom: 1px solid #eee;
            padding-bottom: 25px;
        }

        .filter-group:last-child {
            border-bottom: none;
        }

        .filter-group h3 {
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Checkboxes Styling */
        .filter-options label {
            display: flex;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            font-size: 15px;
            color: #444;
            transition: color 0.2s;
        }

        .filter-options label:hover {
            color: #000;
        }

        .filter-options input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 3px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            position: relative;
        }

        .filter-options input[type="checkbox"]:checked {
            background-color: #000;
            border-color: #000;
        }

        .filter-options input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            left: 3px;
            top: 0px;
        }

        /* Price Range Styling */
        .price-filter {
            padding: 10px 0;
        }

        .price-slider {
            width: 100%;
            margin: 20px 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .price-values {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        /* Results Section Styling */
        .products-section {
            flex: 1;
        }

        .results-info {
            margin-bottom: 30px;
            font-size: 15px;
            color: #666;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Product Card Styling */
        .product-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            z-index: 10;
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease-in-out;
            z-index: 1;
            position: relative;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-details {
            padding: 20px;
            text-align: center;
            background: #fff;
            position: relative;
            z-index: 2;
        }

        .product-details h4 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .product-details p {
            font-size: 14px;
            color: #777;
        }

        .product-card:hover .product-details {
            transform: translateY(0);
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- לשונית עליונה -->
    <script src="js/header.js"></script>
    <div id="header-container"></div>
    <!-- לשונית עליונה -->

    <div class="results-container">
        <aside class="filters-section">
            <div class="filter-group">
                <h3>Brand</h3>
                <div class="filter-options brands-list">
                    <label><input type="checkbox" value="Nike"><span>Nike</span></label>
                    <label><input type="checkbox" value="Adidas"><span>Adidas</span></label>
                    <label><input type="checkbox" value="New Balance"><span>New Balance</span></label>
                    <label><input type="checkbox" value="Converse"><span>Converse</span></label>
                    <label><input type="checkbox" value="Puma"><span>Puma</span></label>
                    <label><input type="checkbox" value="Vans"><span>Vans</span></label>
                </div>
            </div>

            <div class="filter-group">
                <h3>Size</h3>
                <div class="filter-options size-options">
                    <label><input type="checkbox" value="38"><span>38</span></label>
                    <label><input type="checkbox" value="39"><span>39</span></label>
                    <label><input type="checkbox" value="40"><span>40</span></label>
                    <label><input type="checkbox" value="41"><span>41</span></label>
                    <label><input type="checkbox" value="42"><span>42</span></label>
                    <label><input type="checkbox" value="43"><span>43</span></label>
                    <label><input type="checkbox" value="44"><span>44</span></label>
                    <label><input type="checkbox" value="45"><span>45</span></label>
                    <label><input type="checkbox" value="46"><span>46</span></label>
                    <label><input type="checkbox" value="47"><span>47</span></label>
                    <label><input type="checkbox" value="48"><span>48</span></label>
                    <label><input type="checkbox" value="49"><span>49</span></label>
                    <label><input type="checkbox" value="50"><span>50</span></label>
                </div>
            </div>

            <div class="filter-group">
                <h3>Price Range</h3>
                <div class="price-filter">
                    <input type="range" class="price-slider" min="0" max="1000" step="10" value="1000">
                    <div class="price-values">
                        <span>₪0</span>
                        <span>₪1000</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="products-section">
            <div class="results-info">
                Showing 0 results
            </div>
            <div class="products-grid">
                <!-- Products will be loaded here dynamically -->
            </div>
        </main>
    </div>

<!-- לשונית תחתונה -->
<div id="footer-container"></div>
<script src="js/footer.js"></script>
<!-- לשונית תחתונה -->

    <script type="module" src="js/results.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const headerContainer = document.getElementById('header-container');
            fetch('header.html')
                .then(response => response.text())
                .then(html => {
                    headerContainer.innerHTML = html;
        
                    // קריאה לאתחול האירועים של ה־header כדי שה־modal והכפתורים יפעלו כמו שצריך
                    initializeHeaderEvents();
                })
                .catch(error => console.error('Error loading header:', error));
        });
        </script>
</body>
</html>
