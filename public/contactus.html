<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker</title>
    <link rel="icon" href="./images/lf.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="js/contactus.js"></script>

</head>
<body>
    <!-- לשונית עליונה -->
    <script src="js/header.js"></script>
    <div id="header-container"></div>
    <!-- לשונית עליונה -->

    <section class="contact-us">
        <h1>אנחנו כאן בשבילך</h1>
        <p>כתובת לשליחת מיילים: <a href="mailto:flsupport@lootfocker.co.il">flsupport@lootfocker.co.il</a></p>
        <form id="contactForm">
            <div class="form-group">
                <input type="text" name="fullName" placeholder="שם מלא*" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="דואר אלקטרוני*" required>
            </div>
            <div class="form-group">
                <textarea name="message" placeholder="איך נוכל לעזור?*" required></textarea>
            </div>
            <button type="submit">שליחה</button>
        </form>
    </section>
    

<!-- לשונית תחתונה -->
<div id="footer-container"></div>
<script src="js/footer.js"></script>
<!-- לשונית תחתונה -->
</body>
</html>
