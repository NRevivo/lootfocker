<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./images/lf.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- לשונית עליונה -->
    <script src="js/header.js"></script>
    <div id="header-container"></div>
    <!-- לשונית עליונה -->
   
    <div class="checkout-container">
        <h1>Checkout</h1>
        
        <!-- Cart Items Section -->
        <section id="cartItems">
            <h2>Your Cart</h2>
            <div class="cart-items-list"></div>
        </section>

        <!-- Shipping Details Form -->
        <section id="shippingDetails">
            <h2>Shipping Information</h2>
            <form id="shippingForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="postalCode">Postal Code</label>
                    <input type="text" id="postalCode" name="postalCode" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
            </form>
        </section>

        <!-- Payment Section -->
        <section id="payment">
            <h2>Payment</h2>
            <!-- PayPal button will render here -->
            <div id="paypal-button-container"></div>
        </section>
    </div>

    <!-- לשונית תחתונה -->
    <div id="footer-container"></div>
    <script src="js/footer.js"></script>
    <!-- לשונית תחתונה -->

    <script src="https://www.paypal.com/sdk/js?client-id=ATVZQSc2E2ApAgT9Nmm1_7LZNuPjEN2fCgvFtFnLsQBk9wg7lAASvaU4A4DK_7gbMEApj8D6JJXZeMzM&currency=USD"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
