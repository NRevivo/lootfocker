<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Focker - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="admin.js"></script>
</head>
<body>
    <!-- Placeholder for header -->
    <div id="header-container"></div>

    <!-- Admin Panel -->
    <main class="admin-panel">
        <h1>Admin Dashboard</h1>
        <div class="admin-sections">
            <div class="admin-card">
                <h2>Shoes Edit Section</h2>
                <p>Edit your shoe catalog here.</p>
                <button class="btn blue">Edit Shoes</button>
            </div>
            <div class="admin-card">
                <h2>Users Edit Section</h2>
                <p>Manage your users here.</p>
                <button class="btn yellow">Show Users</button>
            </div>
            <div class="admin-card">
                <h2>Past Orders Section</h2>
                <p>View all past orders here.</p>
                <button class="btn black">Show orders</button>
            </div>
            <div class="admin-card">
                <h2>Past Orders Section</h2>
                <p>View orders grouped by users here.</p>
                <button class="btn red">Show grouped orders</button>
            </div>
        </div>

        <!-- אזור תצוגת נתונים נוספים -->
        <div class="data-display" id="data-display">
            <!-- נתונים יופיעו כאן -->
        </div>
    </main>

    <!-- לשונית תחתונה -->
        <div id="footer-container"></div>
</body>
</html>
